name: Build IPK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: webOS CLI installeren
        run: npm install -g @webos-tools/cli

      - name: App controleren
        run: ares-package --check app

      - name: IPK bouwen
        run: ares-package app -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: focus-dashboard-ipk
          path: dist/*.ipk
