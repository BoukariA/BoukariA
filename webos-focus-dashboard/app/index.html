<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Dashboard</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="stage" class="stage" data-view="home">
    <div class="halo" aria-hidden="true"></div>
    <section id="view-home" class="view" aria-label="Home"></section>
    <section id="view-morning" class="view view--session" aria-label="Ochtendsessie" hidden></section>
    <section id="view-focus" class="view view--session" aria-label="Focus" hidden></section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="diag" class="diag" role="dialog" aria-label="Diagnose" hidden></div>
  </div>

  <script src="lib/webOSTVjs-1.2.13/webOSTV.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/tv.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
